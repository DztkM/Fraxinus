events {
    # Determines how many simultaneous connections a single worker process can handle
    worker_connections 1024;
}

http {
    # Disable payload size limit. Essential for uploading large files to MinIO
    # Without this, Nginx defaults to 1MB and returns '413 Request Entity Too Large'
    client_max_body_size 0;

    # Define the backend group for the FastAPI application
    upstream fastapi {
        # server fastapi:8000;
        server host.docker.internal:8000;
    }

    # Define the backend group for MinIO S3 API (Load balancing between 2 nodes)
    upstream minio_s3 {
        server minio1:9000;
        server minio2:9000;
    }

    # Define the backend group for MinIO Web UI Console
    upstream minio_console {
        server minio1:9001;
        server minio2:9001;
    }

    # Server block handling FastAPI requests
    server {
        listen 8000;
        
        location / {
            # Forward all requests to the 'fastapi' upstream
            proxy_pass http://fastapi;

            # Pass original request headers to the backend
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block handling MinIO S3 API requests
    server {
        listen 9000;
        
        # This prevents Nginx from dropping MinIO's custom headers.
        ignore_invalid_headers off;
        # Disable buffering to allow direct streaming of files to/from MinIO.
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio_s3;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Increase timeout for large file uploads/downloads
            proxy_connect_timeout 300;
        }
    }

    # Server block handling MinIO Web Console requests
    server {
        listen 9001;

        ignore_invalid_headers off;
        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio_console;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}